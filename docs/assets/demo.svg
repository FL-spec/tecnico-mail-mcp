<text class="l2" x="24" y="109" fill="#7ee787" xml:space="preserve">search_messages {"from":"tecnico.example","since":"2026-10-30"}</text>
<text class="l3" x="24" y="130" fill="#d7dae0" xml:space="preserve">  2026-11-04  Prof.ª Inês Fictícia     Bases de Dados: notas do primeiro mini-teste</text>
