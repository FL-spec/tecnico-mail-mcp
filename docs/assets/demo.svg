<text class="l8" x="24" y="235" fill="#8b949e" xml:space="preserve">  From:    Prof.ª Marta Exemplo &lt;marta.exemplo@tecnico.example&gt;</text>
<text class="l9" x="24" y="256" fill="#8b949e" xml:space="preserve">  Subject: Sistemas Distribuídos: entrega adiada</text>
<text class="l10" x="24" y="277" fill="#d7dae0" xml:space="preserve">  A entrega do projeto passa para dia 20 de novembro, às 23h59. A discussão mantém-se na se…</text>
<text class="l11" x="24" y="298" fill="#d7dae0" xml:space="preserve"></text>
