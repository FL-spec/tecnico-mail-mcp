# Runs on a version tag: tests, builds, attests, and publishes a GitHub release with the
# Desktop Extension and an npm tarball. Publishing to npm is opt-in; see docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check a final tag is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-*) ;;
            *) git merge-base --is-ancestor "$GITHUB_SHA" origin/main ;;
          esac
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          case "$TAG" in
            "$version" | "$version"-*) ;;
            *) echo "Tag $TAG does not match $version"; exit 1 ;;
          esac
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run package:mcpb
      - name: Pack the npm tarball under a stable name
        run: |
          npm pack --pack-destination dist
          mv dist/tecnico-mail-mcp-*.tgz dist/tecnico-mail-mcp.tgz
      - name: Write checksums
        working-directory: dist
        run: sha256sum tecnico-mail.mcpb tecnico-mail-mcp.tgz > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/tecnico-mail.mcpb
            dist/tecnico-mail-mcp.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          if-no-files-found: error
          path: |
            dist/tecnico-mail.mcpb
            dist/tecnico-mail-mcp.tgz
            dist/SHA256SUMS

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # The notes are this version's section of the changelog.
          awk -v v="## ${version%%-*}" '$0 == v {found=1; next} /^## / {found=0} found' CHANGELOG.md > notes.md
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/tecnico-mail.mcpb dist/tecnico-mail-mcp.tgz dist/SHA256SUMS \
            --title "$TAG" --notes-file notes.md --verify-tag "${flags[@]}"

  npm:
    needs: release
    # Off until the package exists on npm and has a trusted publisher. See docs/releasing.md.
    if: vars.NPM_PUBLISH == 'true' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Install scripts don't run while this job can request a publishing token.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm publish --provenance --access public --ignore-scripts
