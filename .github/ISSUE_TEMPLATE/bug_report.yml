name: Bug report
description: The server crashes, errors, or does the wrong thing.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste your password, real mail, or other people's addresses. Replace them with made-up text."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you asked for, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of doctor
      description: The output of `tecnico-mail-mcp doctor`, if you can run it. Remove your Técnico ID and address.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: From the extension's page, or `tecnico-mail-mcp --version`.
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: AI client and operating system
      placeholder: Claude Desktop on Windows 11
    validations:
      required: true
